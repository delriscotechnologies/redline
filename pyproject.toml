[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.4.0"
description = "Guided AI-agent assessments with offline evidence evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools]
packages = ["redline"]

[tool.setuptools.package-data]
redline = ["*.json", "SKILL.md"]
