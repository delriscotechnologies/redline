[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.3.0"
description = "CLI-first evaluator for AI-agent red-team scenarios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools]
packages = ["redline"]

[tool.setuptools.package-data]
redline = ["*.json"]
