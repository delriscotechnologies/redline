name: holograma

on:
  push:
    branches: [main, holograma]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q redline tests
      - run: redline selftest
        working-directory: ${{ runner.temp }}
      - name: Check README installation in cmd.exe
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          commands = re.search(r"```bat\n(.*?)\n```", readme, re.S).group(1).splitlines()
          commands += [
              'python -c "import sys; print(sys.version); assert sys.prefix != sys.base_prefix"',
              'git rev-parse HEAD',
              'cd /d "%RUNNER_TEMP%"',
              'redline --help',
              'redline selftest',
              'redline catalog list',
          ]
          script = "\n".join(command + "\nif errorlevel 1 exit 1" for command in commands)
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
              subprocess.run(["cmd.exe", "/d", "/q"], input=script + "\nexit 0\n",
                             text=True, cwd=directory, check=True)
